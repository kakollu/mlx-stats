[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-stats"
version = "0.1.0"
description = "Linear regression on Apple Silicon GPUs (MLX + custom Metal kernels) with statsmodels-style results"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Satyanarayana Kakollu" }]
dependencies = ["mlx>=0.32", "numpy>=1.24", "scipy>=1.10"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
test = ["pandas>=2.0", "statsmodels>=0.14", "scikit-learn>=1.3"]

[tool.hatch.build.targets.wheel]
packages = ["mlx_stats"]

[tool.hatch.build.targets.sdist]
include = ["mlx_stats", "tests", "bench/*.py", "README.md", "LICENSE", "pyproject.toml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-stats"
version = "0.1.0"
description = "Linear regression on Apple Silicon GPUs (MLX + custom Metal kernels) with statsmodels-style results"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Satyanarayana Kakollu" }]
dependencies = ["mlx>=0.32", "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "formulaic>=1.1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/kakollu/mlx-stats"
Source = "https://github.com/kakollu/mlx-stats"
Issues = "https://github.com/kakollu/mlx-stats/issues"

[project.optional-dependencies]
files = ["pyarrow>=14", "openpyxl>=3.1"]
test = ["statsmodels>=0.14", "scikit-learn>=1.3"]

[project.scripts]
mlx-stats = "mlx_stats.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mlx_stats"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/mlx_stats", "/tests", "/bench/*.py", "/README.md", "/LICENSE", "/pyproject.toml", "/hatch_build.py"]
